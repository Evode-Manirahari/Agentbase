# Fly.io config for the Agentbase web dashboard.
#
# Deploys the Next.js dashboard as a separate Fly app pointing at the API
# you already deployed via fly.api.toml.
#
# First-time setup (from the repo root, after the API is up):
#
#   fly apps create agentbase-web-CHANGEME --config infra/fly.web.toml
#   fly secrets set API_URL=https://agentbase-api-CHANGEME.fly.dev \
#     --config infra/fly.web.toml
#
# Deploy:
#
#   fly deploy --config infra/fly.web.toml --remote-only

app = "agentbase-web-CHANGEME"
primary_region = "iad"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # API_URL is set via fly secrets (see header) so it isn't checked into git.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
