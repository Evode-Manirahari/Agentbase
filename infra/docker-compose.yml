services:
  postgres:
    image: postgres:16-alpine
    container_name: agentbase-postgres
    environment:
      POSTGRES_USER: agentbase
      POSTGRES_PASSWORD: agentbase
      POSTGRES_DB: agentbase
    ports:
      - "5433:5432"
    volumes:
      - agentbase-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbase -d agentbase"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agentbase-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agentbase-pg:
