services:
  postgres:
    image: postgres:16-alpine
    container_name: dejavas-postgres
    environment:
      POSTGRES_USER: dejavas
      POSTGRES_PASSWORD: dejavas
      POSTGRES_DB: dejavas
    ports:
      - "5433:5432"
    volumes:
      - dejavas-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dejavas -d dejavas"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dejavas-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dejavas-pg:
