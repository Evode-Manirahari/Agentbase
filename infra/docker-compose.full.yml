# Full-stack compose — postgres + redis + migrate + api + web in one shot.
# Use for: demoing the product, integration testing, single-command "make
# this run on a fresh machine."
#
# For day-to-day development (where you want hot-reload on api + web),
# use infra/docker-compose.yml instead and run pnpm --filter ... dev locally.
#
# Run from the repo root:
#   docker compose -f infra/docker-compose.full.yml up --build
#
# Then open http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentbase-full-postgres
    environment:
      POSTGRES_USER: agentbase
      POSTGRES_PASSWORD: agentbase
      POSTGRES_DB: agentbase
    ports:
      - "${AGENTBASE_BIND_HOST:-127.0.0.1}:5433:5432"
    volumes:
      - agentbase-full-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentbase -d agentbase"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agentbase-full-redis
    ports:
      - "${AGENTBASE_BIND_HOST:-127.0.0.1}:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: runs drizzle-kit push --force, then exits successfully.
  # Re-uses the API image so we don't have to maintain a parallel one.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agentbase-full-migrate
    environment:
      DATABASE_URL: postgresql://agentbase:agentbase@postgres:5432/agentbase
    command:
      - "pnpm"
      - "--filter"
      - "@agentbase/db"
      - "exec"
      - "drizzle-kit"
      - "push"
      - "--force"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agentbase-full-api
    # Loopback by default. These services run unauthenticated (see below), and
    # a bare "3002:3002" publishes on every host interface — which on any
    # shared network means an open /v1 to anyone who can route to this
    # machine. Override AGENTBASE_BIND_HOST=0.0.0.0 only with auth configured.
    ports:
      - "${AGENTBASE_BIND_HOST:-127.0.0.1}:3002:3002"
    environment:
      DATABASE_URL: postgresql://agentbase:agentbase@postgres:5432/agentbase
      REDIS_URL: redis://redis:6379
      PORT: 3002
      NODE_ENV: production
      # Demo-only default so the Connectors page can store org credentials.
      # Set CONNECTOR_CREDENTIALS_KEY in your shell before using this outside
      # local demo mode.
      CONNECTOR_CREDENTIALS_KEY: ${CONNECTOR_CREDENTIALS_KEY:-hex:64656a617661732d6c6f63616c2d646f636b65722d6b65792d33326279746521}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3002}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      # NODE_ENV=production above makes the API refuse to boot without auth
      # rather than silently expose /v1 — correct, and it is why this file did
      # not start at all until the opt-in below was added.
      #
      # This is the demo path: it has to come up on a fresh machine with no
      # Clerk project and no secrets, so the opt-in is stated explicitly rather
      # than left to be discovered as a crash. CLERK_SECRET_KEY is checked
      # first by resolveAuthMode(), so passing a real key still enforces auth
      # and this default becomes inert.
      #
      # NOT safe for anything an untrusted network can reach: every /v1
      # endpoint is open. Set CLERK_SECRET_KEY before exposing this.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      AGENTBASE_ALLOW_UNAUTHENTICATED: ${AGENTBASE_ALLOW_UNAUTHENTICATED:-1}
      # Optional credentials — uncomment / fill via .env, OR set them in
      # your shell before `docker compose up`. Without these, connector
      # invocations cleanly return connector_not_configured (per-connector
      # graceful degradation), and Slack inbound returns 503.
      # HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      # HUBSPOT_CLIENT_ID: ${HUBSPOT_CLIENT_ID:-}
      # HUBSPOT_CLIENT_SECRET: ${HUBSPOT_CLIENT_SECRET:-}
      # HUBSPOT_SCOPES: ${HUBSPOT_SCOPES:-}
      # HUBSPOT_REDIRECT_URI: ${HUBSPOT_REDIRECT_URI:-}
      # SALESFORCE_ACCESS_TOKEN: ${SALESFORCE_ACCESS_TOKEN:-}
      # SALESFORCE_INSTANCE_URL: ${SALESFORCE_INSTANCE_URL:-}
      # SALESFORCE_CLIENT_ID: ${SALESFORCE_CLIENT_ID:-}
      # SALESFORCE_CLIENT_SECRET: ${SALESFORCE_CLIENT_SECRET:-}
      # SALESFORCE_SCOPES: ${SALESFORCE_SCOPES:-}
      # SALESFORCE_REDIRECT_URI: ${SALESFORCE_REDIRECT_URI:-}
      # GMAIL_ACCESS_TOKEN: ${GMAIL_ACCESS_TOKEN:-}
      # GMAIL_USER_ID: ${GMAIL_USER_ID:-}
      # GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      # GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      # GMAIL_SCOPES: ${GMAIL_SCOPES:-}
      # GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      # OUTREACH_ACCESS_TOKEN: ${OUTREACH_ACCESS_TOKEN:-}
      # OUTREACH_CLIENT_ID: ${OUTREACH_CLIENT_ID:-}
      # OUTREACH_CLIENT_SECRET: ${OUTREACH_CLIENT_SECRET:-}
      # OUTREACH_SCOPES: ${OUTREACH_SCOPES:-}
      # OUTREACH_REDIRECT_URI: ${OUTREACH_REDIRECT_URI:-}
      # APOLLO_API_KEY: ${APOLLO_API_KEY:-}
      # SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      # SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      # SLACK_APPROVALS_CHANNEL: ${SLACK_APPROVALS_CHANNEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: agentbase-full-web
    ports:
      - "${AGENTBASE_BIND_HOST:-127.0.0.1}:3000:3000"
    environment:
      # Server-side fetches go through the docker network to the api service
      API_URL: http://api:3002
      PORT: 3000
      NODE_ENV: production
      # The dashboard carries the same guard as the API (apps/web/src/lib/
      # auth-mode.ts) but throws per-request instead of at boot. Without this
      # the container starts fine and every page returns 500; the healthcheck
      # only flips it to unhealthy about 40s later, well after `up` has
      # already reported success.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      AGENTBASE_ALLOW_UNAUTHENTICATED: ${AGENTBASE_ALLOW_UNAUTHENTICATED:-1}
      #
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is deliberately NOT passed here.
      # It is what flips the dashboard to enforced auth, but Next.js inlines
      # NEXT_PUBLIC_* at build time — setting it as a runtime env on an
      # already-built image would not reach the client bundle, so listing it
      # would advertise a switch that does not work. Enabling dashboard auth
      # means rebuilding the web image with the key present at build time.
    depends_on:
      api:
        condition: service_healthy

volumes:
  agentbase-full-pg:
