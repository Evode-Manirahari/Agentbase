# Fly.io config for the Agentbase API.
#
# First-time setup (from the repo root):
#
#   fly apps create agentbase-api-CHANGEME --config infra/fly.api.toml
#   fly postgres create --name agentbase-pg-CHANGEME --region iad
#   fly postgres attach agentbase-pg-CHANGEME --app agentbase-api-CHANGEME  # sets DATABASE_URL
#   fly redis create --name agentbase-redis-CHANGEME --region iad           # set REDIS_URL via fly secrets set
#
#   fly secrets set REDIS_URL=redis://... --config infra/fly.api.toml
#   fly secrets set CONNECTOR_CREDENTIALS_KEY="base64:$(openssl rand -base64 32)" --config infra/fly.api.toml
#   fly secrets set API_PUBLIC_URL=https://agentbase-api-CHANGEME.fly.dev DASHBOARD_URL=https://agentbase-web-CHANGEME.fly.dev \
#     --config infra/fly.api.toml
#   # Plus any of these you want wired:
#   fly secrets set HUBSPOT_ACCESS_TOKEN=pat-... --config infra/fly.api.toml
#   fly secrets set HUBSPOT_CLIENT_ID=... HUBSPOT_CLIENT_SECRET=... --config infra/fly.api.toml
#   fly secrets set SALESFORCE_ACCESS_TOKEN=... SALESFORCE_INSTANCE_URL=... --config infra/fly.api.toml
#   fly secrets set GMAIL_ACCESS_TOKEN=... --config infra/fly.api.toml
#   fly secrets set OUTREACH_ACCESS_TOKEN=... --config infra/fly.api.toml
#   fly secrets set APOLLO_API_KEY=... --config infra/fly.api.toml
#   fly secrets set SLACK_BOT_TOKEN=xoxb-... SLACK_SIGNING_SECRET=... SLACK_APPROVALS_CHANNEL=C... \
#     --config infra/fly.api.toml
#
# Deploy:
#
#   fly deploy --config infra/fly.api.toml --remote-only
#
# The container image is rebuilt by Fly's remote builder from the repo's Dockerfile.
# Optionally point at the prebuilt GHCR image instead — see [build] below.

app = "agentbase-api-CHANGEME"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Or use the prebuilt image instead of remote-building:
  # image = "ghcr.io/evode-manirahari/agentbase-api:latest"

[env]
  NODE_ENV = "production"
  PORT = "3002"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
