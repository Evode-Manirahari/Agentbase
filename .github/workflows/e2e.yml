name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: dashboard E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dejavas
          POSTGRES_PASSWORD: dejavas
          POSTGRES_DB: dejavas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dejavas -d dejavas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://dejavas:dejavas@localhost:5433/dejavas
      REDIS_URL: redis://localhost:6380
      API_URL: http://localhost:3002
      PORT: 3002

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database schema
        run: pnpm --filter '@dejavas/db' exec drizzle-kit push --force

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter '@dejavas/web' run test:e2e:install

      - name: Run Playwright tests
        run: pnpm --filter '@dejavas/web' run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
