name: Publish booking-audit

# Publishes packages/booking-audit to npm when a tag like booking-audit-v0.1.0
# is pushed. Nothing here runs on an ordinary push.
#
# Before the first release:
#   1. Confirm the package name in packages/booking-audit/package.json is one
#      you own on npm (the @agentbase scope has not been checked).
#   2. Add an NPM_TOKEN repository secret with publish rights.
#   3. Tag: git tag booking-audit-v0.1.0 && git push origin booking-audit-v0.1.0

on:
  push:
    tags:
      - 'booking-audit-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: test + build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: The tag must match the package version
        working-directory: packages/booking-audit
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "booking-audit-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi

      - name: Lint, typecheck, test
        run: |
          pnpm --filter '@agentbase/booking-audit' run lint
          pnpm --filter '@agentbase/booking-audit' run typecheck
          pnpm --filter '@agentbase/booking-audit' run test

      - name: Build
        run: pnpm --filter '@agentbase/booking-audit' run build

      - name: Smoke-test the built CLI
        working-directory: packages/booking-audit
        run: |
          node dist/cli.js --version
          node dist/cli.js demo --out "$RUNNER_TEMP/booking-audit-demo"
          test -s "$RUNNER_TEMP/booking-audit-demo/report.html"

      - name: Publish
        working-directory: packages/booking-audit
        run: |
          cp ../../LICENSE ./LICENSE
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
