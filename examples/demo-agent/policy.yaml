version: 1
default: deny

# Demo policy that exercises every Agentbase effect:
# - allow:           safe reads (Apollo) and most CRM writes
# - require_approval: high-value deal updates and Outreach enrollment
# - deny:            anything destructive (e.g. *.delete)
rules:
  # Apollo enrichment — read-only, always allow
  - match: { tool: 'apollo.*' }
    effect: allow
    reason: 'enrichment is read-only'

  # Drafting an email is fine — the human still has to send it, and we have
  # no auto-send rule below
  - match: { tool: 'gmail.draft.create' }
    effect: allow
    reason: 'drafts never leave the outbox without a human'

  # Sending email and routine CRM writes — allowed without approval
  - match: { tool: 'gmail.send' }
    effect: allow
  - match: { tool: 'hubspot.connection.test' }
    effect: allow
  - match: { tool: 'hubspot.contacts.search' }
    effect: allow
  - match: { tool: 'hubspot.contacts.create' }
    effect: allow
  - match: { tool: 'hubspot.contacts.update' }
    effect: allow
  - match: { tool: 'hubspot.contacts.upsert' }
    effect: allow
  - match: { tool: 'hubspot.contacts.associate' }
    effect: allow
  - match: { tool: 'hubspot.deals.create' }
    effect: allow
  - match: { tool: 'hubspot.deals.associate' }
    effect: allow
  - match: { tool: 'hubspot.notes.create' }
    effect: allow
  - match: { tool: 'hubspot.tasks.create' }
    effect: allow

  # High-value lead-to-deal workflow requires approval before any CRM writes happen
  - match:
      tool: 'hubspot.leads.create_deal'
      when:
        deal.amount: { gte: 10000 }
    effect: require_approval
    approver_role: approver
    reason: 'high-value lead deal creation'
    slack_channel: '#critical-approvals'

  - match: { tool: 'hubspot.leads.create_deal' }
    effect: allow

  # High-value deal updates require human approval (>= $10k)
  - match:
      tool: 'hubspot.deals.update'
      when:
        properties.amount: { gte: 10000 }
    effect: require_approval
    approver_role: approver
    reason: 'high-value deal change'
    slack_channel: '#critical-approvals'

  # Lower-value deal updates auto-approve
  - match: { tool: 'hubspot.deals.update' }
    effect: allow

  # Outreach sequence enrollment always needs sign-off — sales rep should know
  # which prospects are getting touched
  - match: { tool: 'outreach.sequences.enroll' }
    effect: require_approval
    approver_role: approver
    reason: 'sequence enrollment touches real prospects'

  # Catch-all delete protection
  - match: { tool: '*.delete' }
    effect: deny
    reason: 'deletes are blocked across the board'
